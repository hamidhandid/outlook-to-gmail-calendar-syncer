# One-way Outlook → Google Calendar. Copy this file to config.yaml
# or run: python -m syncer setup

# ews   = talk to Exchange / OWA host directly (does not need Apple Mail)
# apple = read calendars already added in Calendar.app
source: ews

# Rolling window around today (UTC).
days_back: 7
days_forward: 60

# full = copy title, location, notes
# busy = only block the time as "Busy" (safer for a personal Google account)
privacy: full

ews:
  server: mail.digikala.com
  email: you@company.com
  # Leave empty to use the same as email. If login fails, try COMPANY\your.account
  username: ""
  # On-prem Exchange usually wants ntlm. Switch to basic if ntlm is rejected.
  auth: ntlm
  # Empty = default mailbox calendar. Run: python -m syncer list-calendars
  calendar: ""
  verify_ssl: false

# Only used when source: apple
apple_calendar: "Exchange / Calendar"

# Google Calendar that will receive copies. Created automatically if missing.
google_calendar: "Work (Outlook)"

# Leave empty to use the OS timezone (macOS Foundation / tzlocal elsewhere).
timezone: ""

# Background schedule interval when using install-schedule: 15m, 30m, 1h, 3h, 6h, 12h
schedule_every: 15m
